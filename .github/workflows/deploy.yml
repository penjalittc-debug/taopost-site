name: Deploy to Selectel

# Автодеплой сайта на 155.212.182.80 (pm2 taopost-site, /var/www/taopost-site).
#
# 01.09.2026: раньше workflow требовал четыре секрета (SSH_HOST, SSH_USER,
# SSH_KEY, DEPLOY_PATH), не был настроен ни один, и ручной запуск падал с
# «missing server host». Секретом здесь по сути является только ключ — адрес
# сервера, пользователь и путь секретов не содержат, поэтому они переехали
# в дефолты ниже. Осталось задать ОДИН секрет:
#
#   gh secret set SSH_KEY -R penjalittc-debug/taopost-site < ~/.ssh/taopost_deploy
#
# Пока SSH_KEY не задан, push просто пропускает деплой с предупреждением,
# а ручной запуск падает — чтобы «нажал кнопку, ничего не произошло» не выглядело
# как успех. Как настроить ключ — docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Проверка ключа
        id: gate
        env:
          HAS_KEY: ${{ secrets.SSH_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=0" >> "$GITHUB_OUTPUT"
          echo "::warning::SSH_KEY не задан — деплой пропущен, сайт остался на прежней версии. См. docs/deploy.md"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Ручной запуск без SSH_KEY — это ошибка настройки, а не штатный пропуск."
            exit 1
          fi

      - name: Deploy via SSH
        if: steps.gate.outputs.ok == '1'
        uses: appleboy/ssh-action@v1.0.3
        # Переменные почты приходят из GitHub Secrets и доставляются на сервер
        # самим деплоем. Это сделано 18.09.2026, потому что порт 22 сервера
        # закрыт для наших IP (у владельца и у консультанта — timeout), а из
        # GitHub Actions SSH проходит. Значения передаются через envs, а не
        # подставляются в текст скрипта, чтобы пароль не попал в лог сборки.
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          LEAD_EMAIL_TO: ${{ secrets.LEAD_EMAIL_TO }}
        with:
          host: ${{ secrets.SSH_HOST || '155.212.182.80' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_SECURE,LEAD_EMAIL_TO
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/var/www/taopost-site' }}
            echo "=== Env ==="
            # Обновляем только те ключи, что пришли из секретов; остальные
            # строки .env не трогаем. Значение пишем через переменную, не через
            # sed, — пароль может содержать символы, ломающие выражение.
            upsert_env() {
              local key="$1"
              local val="$2"
              [ -z "$val" ] && return 0
              touch .env
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              printf '%s=%s\n' "$key" "$val" >> .env.tmp
              mv .env.tmp .env
              echo "  $key — обновлён"
            }
            upsert_env SMTP_HOST "$SMTP_HOST"
            upsert_env SMTP_PORT "$SMTP_PORT"
            upsert_env SMTP_USER "$SMTP_USER"
            upsert_env SMTP_PASS "$SMTP_PASS"
            upsert_env SMTP_FROM "$SMTP_FROM"
            upsert_env SMTP_SECURE "$SMTP_SECURE"
            upsert_env LEAD_EMAIL_TO "$LEAD_EMAIL_TO"
            chmod 600 .env || true
            echo "=== Pull ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Install ==="
            npm ci --no-audit --no-fund
            echo "=== Build ==="
            npm run build
            # Раньше здесь стоял `pm2 reload all` — он перезапускал и taopost-app,
            # то есть деплой сайта ронял на секунды личный кабинет. Трогаем только сайт.
            echo "=== Reload ==="
            ${{ secrets.RELOAD_CMD || 'pm2 reload taopost-site' }}
            echo "=== Done ==="
